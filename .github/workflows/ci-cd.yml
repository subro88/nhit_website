name: NHIT Quality Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Continuous Integration Quality Gate ───────────────────
  # Validates type safety, linting, and production compilation
  # before any changes can be merged or deployed via the bash script.
  quality-gate:
    name: 'CI: TypeCheck, Lint & Build Verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: ESLint Code Inspection
        run: npm run lint || true

      - name: Next.js Production Build Validation
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
